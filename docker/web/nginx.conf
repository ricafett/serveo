server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript text/javascript image/svg+xml
               application/xml+rss font/truetype font/opentype;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Cache static assets with hashed filenames (safe to cache aggressively)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Filament assets (versioned by ?v= query string)
    location /css/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /js/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
        # Forward Host so Laravel sees the real domain.
        fastcgi_param HTTP_HOST $host;
        # Forward proxy headers only when present (if_not_empty prevents
        # passing empty strings, which Symfony interprets as truthy values
        # and crashes on in getPort()/getHost()).
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for if_not_empty;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
