name: Build and push Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without using layer cache'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check .dockerignore
        run: |
          if [ ! -f .dockerignore ]; then
            echo "::error::.dockerignore is missing"
            exit 1
          fi
          if ! grep -q '^\.git/' .dockerignore; then
            echo "::error::.dockerignore must exclude .git/"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (load for validation)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/app/Dockerfile
          push: false
          load: true
          tags: serveo-app:ci
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate app image
        run: |
          echo "Verifying image structure..."
          docker run --rm --entrypoint php serveo-app:ci -v
          docker run --rm --entrypoint php serveo-app:ci -m | grep -qE 'pdo_pgsql|redis|gd|intl|bcmath|pcntl' && echo "Required extensions OK"
          docker run --rm --entrypoint ls serveo-app:ci /var/www/html/vendor/autoload.php && echo "Composer autoload OK"
          echo "Image validation passed."

      - name: Push app image
        if: github.event_name != 'pull_request'
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag serveo-app:ci "$tag"
            docker push "$tag"
          done

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: docker/web
          file: docker/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
