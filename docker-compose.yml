services:
  app:
    image: ghcr.io/ricafett/serveo:latest
    container_name: serveo-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app-public:/var/www/html/public
    environment:
      APP_NAME: ${APP_NAME:-Serveo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-serveo}
      DB_USERNAME: ${DB_USERNAME:-serveo}
      DB_PASSWORD: ${DB_PASSWORD:-serveo}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      SERVEO_PRINT_AGENT_URL: ${SERVEO_PRINT_AGENT_URL:-}
      SERVEO_PRINT_AGENT_TOKEN: ${SERVEO_PRINT_AGENT_TOKEN:-}
    depends_on:
      - postgres
      - redis
    networks:
      - serveo

  web:
    image: ghcr.io/ricafett/serveo-web:latest
    container_name: serveo-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app-public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - serveo

  postgres:
    image: postgres:16-alpine
    container_name: serveo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-serveo}
      POSTGRES_USER: ${DB_USERNAME:-serveo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-serveo}
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - serveo

  redis:
    image: redis:7-alpine
    container_name: serveo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${REDIS_DATA_PATH:-./data/redis}:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - serveo

  worker:
    image: ghcr.io/ricafett/serveo:latest
    container_name: serveo-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=120", "--queue=prints,default"]
    environment:
      APP_NAME: ${APP_NAME:-Serveo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-serveo}
      DB_USERNAME: ${DB_USERNAME:-serveo}
      DB_PASSWORD: ${DB_PASSWORD:-serveo}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVEO_PRINT_AGENT_URL: ${SERVEO_PRINT_AGENT_URL:-}
      SERVEO_PRINT_AGENT_TOKEN: ${SERVEO_PRINT_AGENT_TOKEN:-}
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - serveo

  scheduler:
    image: ghcr.io/ricafett/serveo:latest
    container_name: serveo-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment:
      APP_NAME: ${APP_NAME:-Serveo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-serveo}
      DB_USERNAME: ${DB_USERNAME:-serveo}
      DB_PASSWORD: ${DB_PASSWORD:-serveo}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVEO_PRINT_AGENT_URL: ${SERVEO_PRINT_AGENT_URL:-}
      SERVEO_PRINT_AGENT_TOKEN: ${SERVEO_PRINT_AGENT_TOKEN:-}
    depends_on:
      - app
    networks:
      - serveo

volumes:
  app-public:

networks:
  serveo:
    driver: bridge
