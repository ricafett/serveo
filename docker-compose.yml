services:
  app:
    image: ghcr.io/ricafett/serveo:latest
    container_name: serveo-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app-public:/var/www/html/public
    environment:
      APP_NAME: ${APP_NAME:-Serveo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-pt-PT}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-pt-PT}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_STACK: ${LOG_STACK:-daily}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-serveo}
      DB_USERNAME: ${DB_USERNAME:-serveo}
      DB_PASSWORD: ${DB_PASSWORD:-serveo}
      DB_TIMEZONE: ${DB_TIMEZONE:-UTC}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      SERVEO_PRINT_AGENT_URL: ${SERVEO_PRINT_AGENT_URL:-}
      SERVEO_PRINT_AGENT_TOKEN: ${SERVEO_PRINT_AGENT_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serveo

  web:
    image: ghcr.io/ricafett/serveo-web:latest
    container_name: serveo-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app-public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - serveo

  postgres:
    image: postgres:16-alpine
    container_name: serveo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-serveo}
      POSTGRES_USER: ${DB_USERNAME:-serveo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-serveo}
      TZ: ${APP_TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME:-serveo} -d $${DB_DATABASE:-serveo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - serveo

  redis:
    image: redis:7-alpine
    container_name: serveo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - ${REDIS_DATA_PATH:-./data/redis}:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - serveo

  worker:
    image: ghcr.io/ricafett/serveo:latest
    container_name: serveo-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=120", "--queue=prints,default"]
    environment:
      APP_NAME: ${APP_NAME:-Serveo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-pt-PT}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-pt-PT}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_STACK: ${LOG_STACK:-daily}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-serveo}
      DB_USERNAME: ${DB_USERNAME:-serveo}
      DB_PASSWORD: ${DB_PASSWORD:-serveo}
      DB_TIMEZONE: ${DB_TIMEZONE:-UTC}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVEO_PRINT_AGENT_URL: ${SERVEO_PRINT_AGENT_URL:-}
      SERVEO_PRINT_AGENT_TOKEN: ${SERVEO_PRINT_AGENT_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serveo

  scheduler:
    image: ghcr.io/ricafett/serveo:latest
    container_name: serveo-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment:
      APP_NAME: ${APP_NAME:-Serveo}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_STACK: ${LOG_STACK:-daily}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-serveo}
      DB_USERNAME: ${DB_USERNAME:-serveo}
      DB_PASSWORD: ${DB_PASSWORD:-serveo}
      DB_TIMEZONE: ${DB_TIMEZONE:-UTC}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVEO_PRINT_AGENT_URL: ${SERVEO_PRINT_AGENT_URL:-}
      SERVEO_PRINT_AGENT_TOKEN: ${SERVEO_PRINT_AGENT_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:run' || pgrep -f 'sleep 60' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serveo

volumes:
  app-public:

networks:
  serveo:
    driver: bridge
